_inputs:
  address:
    label: Address
    options:
      required: false
      structures: _structures.address
      subtype: object
    preview:
      text:
      - key: title
      - key: name
      - key: text
    type: object
  authors:
    label: Authors
    options:
      value_key:
      - filename_without_ext
      values: collections.persons
    type: multiselect
  categories:
    label: Categories
    options:
      value_key:
      - title
      values: collections.categories
    type: multiselect
  contact:
    label: Contact
    options:
      required: false
      structures: _structures.contact
      subtype: object
    preview:
      text:
      - key: title
      - key: name
      - key: text
    type: object
  datas:
    label: Datas
    options:
      required: false
      structures: _structures.datas
    preview:
      text:
      - key: title
      - key: name
      - key: text
    singular_name: Data
    type: array
  date:
    instance_value: NOW
    label: Date
    options:
      required: true
    type: datetime
  description:
    comment: Displayed in tabs, search results, and in SMS/Messages/Social networks preview
    label: Description
    options:
      required: false
    type: textarea
  draft:
    label: Draft
    options:
      required: false
    type: switch
    value: true
  hero:
    label: Hero
    options:
      required: false
      structures: _structures.hero
      subtype: object
    preview:
      text:
      - key: title
      - key: name
      - key: text
    type: object
  icon:
    comment: Icon name from https://icons.getbootstrap.com/
    label: Icon
    options:
      required: false
    type: text
  image:
    comment: Displayed in search results, and in SMS/Messages/Social networks preview
    label: Image principale
    options:
      required: false
      structures: _structures.image
      subtype: object
    preview:
      text:
      - key: title
      - key: name
      - key: text
    type: object
  images:
    label: Images
    options:
      required: false
      structures: _structures.images
    preview:
      text:
      - key: title
      - key: name
      - key: text
    singular_name: Image
    type: array
  isIndex:
