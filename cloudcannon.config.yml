  casestudies:
    _enabled_editors:
    - data
    comment: All cases studies
    create:
      path: '[relative_base_path]/{date|year}/{title|slugify}.md'
    disable_add: false
    disable_add_folder: true
    icon: web_stories
    name: Cases studies
    path: content/casestudies
    preview:
      gallery:
        image:
