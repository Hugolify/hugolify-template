


paths:
  static: /assets
  uploads: /assets/images/uploads


_snippets_imports:
  hugo:
    exclude:
      - hugo_figure


_snippets:
  hugolify_alert:
    _inputs:
      state:
        label: State
        options:
          required: true
          value_key: value
          values:
          - name: Danger
            value: danger
          - name: Dark
            value: dark
          - name: Info
            value: info
          - name: Light
            value: light
          - name: Primary
            value: primary
          - name: Secondary
            value: secondary
          - name: Success
            value: success
          - name: Warning
            value: warning
        type: select
      text:
        label: Text
        options:
          required: false
        type: text
    definitions:
      named_args:
      - editor_key: text
        type: string
      - editor_key: state
        optional: true
        type: string
      shortcode_name: alert
    inline: false
    preview:
      icon: warning
      text: Alert
    template: hugo_shortcode_named_args
  hugolify_alert_block:
    _inputs:
      contents:
        label: Contents
        options:
          allow_resize: true
          initial_height: 150
          required: false
        type: markdown
      state:
        label: State
        options:
          required: true
          value_key: value
          values:
          - name: Danger
            value: danger
          - name: Dark
            value: dark
          - name: Info
            value: info
          - name: Light
            value: light
          - name: Primary
            value: primary
          - name: Secondary
            value: secondary
          - name: Success
            value: success
          - name: Warning
            value: warning
        type: select
    definitions:
      content_key: contents
      named_args:
      - editor_key: state
        type: string
      shortcode_name: alert-block
    inline: false
    preview:
      icon: warning
      text: Alert
    template: hugo_paired_shortcode_named_args
  hugolify_badge:
    _inputs:
      state:
        label: State
        options:
          required: true
          value_key: value
          values:
          - name: Danger
            value: danger
          - name: Dark
            value: dark
          - name: Info
            value: info
          - name: Light
            value: light
          - name: Primary
            value: primary
          - name: Secondary
            value: secondary
          - name: Success
            value: success
          - name: Warning
            value: warning
        type: select
      text:
        label: Text
        options:
          required: false
        type: text
    definitions:
      named_args:
      - editor_key: text
        type: string
      - editor_key: state
        optional: true
        type: string
      shortcode_name: badge
    inline: true
    preview:
      icon: label
      text: Badge
    template: hugo_shortcode_named_args
  hugolify_blank_link:
    _inputs:
      link:
        comment: Absolute URL (e.g https://www.example.com)
        label: URL
        options:
          required: false
        type: text
      text:
        label: Text
        options:
          required: false
        type: text
    definitions:
      named_args:
      - editor_key: text
        type: string
      - editor_key: link
        type: string
      shortcode_name: blank_link
    inline: true
    preview:
      icon: open_in_new
      text: Link (new window)
    template: hugo_shortcode_named_args
  hugolify_blockquote:
    _inputs:
      image:
        comment: 'Resize and compress image before sending : https://bulkresizephotos.com/fr?quality=90&type=width&width=1600'
        label: Image
        options:
          accepts_mime_types:
          - image/avif
          - image/gif
          - image/jpeg
          - image/png
          - image/webp
          - image/svg+xml
          max_file_size: '700000'
          required: false
        type: image
      quote:
        label: Quote
        options:
          allow_resize: true
          initial_height: 150
          required: false
        type: markdown
      text:
        label: Text
        options:
          required: false
        type: text
      title:
        label: Title
        options:
          required: false
        type: text
    definitions:
      named_args:
      - editor_key: quote
        type: string
      - editor_key: title
        optional: true
        type: string
      - editor_key: text
        optional: true
        type: string
      - editor_key: image
        optional: true
        type: string
      shortcode_name: blockquote
    inline: false
    preview:
      icon: format_quote
      text: Blockquote
    template: hugo_shortcode_named_args
  hugolify_button:
    _inputs:
      blank:
        label: New window?
        options:
          required: false
        type: switch
      class:
        label: Class
        options:
          required: false
        type: text
      text:
        label: Text
        options:
          required: false
        type: text
      url:
        comment: Absolute URL (e.g https://www.example.com)
        label: URL
        options:
          required: false
        type: url
    definitions:
      named_args:
      - editor_key: text
        type: string
      - editor_key: url
        type: string
      - editor_key: class
        optional: true
        type: string
      - editor_key: blank
        optional: true
        type: boolean
      shortcode_name: button
    inline: true
    preview:
      icon: link
      text: Button
    template: hugo_shortcode_named_args
  hugolify_dailymotion:
    _inputs:
      id:
        label: Dailymotion ID
        options:
          required: false
        type: text
    definitions:
      positional_args:
      - editor_key: id
        type: string
      shortcode_name: dailymotion
    inline: false
    preview:
      icon: videocam
      text: Dailymotion
    template: hugo_shortcode_positional_args
  hugolify_details:
    _inputs:
      contents:
        label: Contents
        options:
          allow_resize: true
          initial_height: 150
          required: false
        type: markdown
      name:
        label: Name
        options:
          required: false
        type: text
      summary:
        label: Summary
        options:
          required: false
        type: text
      title:
        label: Title
        options:
          required: false
        type: text
    definitions:
      content_key: contents
      named_args:
      - editor_key: summary
        type: string
      - editor_key: name
        optional: true
        type: string
      - editor_key: title
        optional: true
        type: string
      shortcode_name: details
    inline: false
    preview:
      icon: quiz
      text: Details
    template: hugo_paired_shortcode_named_args
  hugolify_figure:
    _inputs:
      alt:
        comment: For an image that conveys information (leave blank if decorative image)
        label: Text alternative
        options:
          required: false
        type: text
      credit:
        label: Credit
        options:
          allow_resize: true
          initial_height: 150
          required: false
        type: markdown
      legend:
        label: Legend
        options:
          required: false
        type: text
      screenshot:
        comment: Add fake browser
        label: Is screenshot?
        options:
          required: false
        type: switch
      src:
        comment: 'Resize and compress image before sending : https://bulkresizephotos.com/fr?quality=90&type=width&width=1600'
        label: Image
        options:
          accepts_mime_types:
          - image/avif
          - image/gif
          - image/jpeg
          - image/png
          - image/webp
          - image/svg+xml
          max_file_size: '700000'
          required: false
        type: image
    definitions:
      named_args:
      - editor_key: src
        type: string
      - editor_key: alt
        optional: true
        type: string
      - editor_key: legend
        optional: true
        type: string
      - editor_key: credit
        optional: true
        type: string
      - editor_key: screenshot
        optional: true
        type: boolean
      shortcode_name: figure
    inline: false
    preview:
      icon: image
      text: Image block
    template: hugo_shortcode_named_args
  hugolify_map:
    _inputs:
      markers:
        comment: 'JSON coordinates. e.g.: {"coordinates":[44.8425666,-0.5737107]},{"coordinates":[45.8425666,1.5937107]},{"coordinates":[46.8425666,-0.5737107]}'
        label: Markers
        options:
          required: false
        type: text
    definitions:
      icon: map
      named_args:
      - editor_key: markers
        type: string
      shortcode_name: map
    inline: false
    preview:
      text: Map
    template: hugo_shortcode_named_args
  hugolify_span_lang:
    _inputs:
      lang:
        comment: Enter code lang (e.g. fr) if different of the current page language
        label: Language
        options:
          required: false
        type: text
      text:
        label: Text
        options:
          required: false
        type: text
    definitions:
      icon: language
      named_args:
      - editor_key: text
        type: string
      - editor_key: lang
        type: string
      shortcode_name: span_lang
    inline: true
    preview:
      text: Language (span)
    template: hugo_shortcode_named_args
  hugolify_twitch:
    _inputs:
      id:
        label: Twitch ID
        options:
          required: false
        type: text
    definitions:
      positional_args:
      - editor_key: id
        type: string
      shortcode_name: twitch
    inline: false
    preview:
      icon: videocam
      text: Twitch
    template: hugo_shortcode_positional_args
  hugolify_video:
    _inputs:
      controls:
        label: Controls
        options:
          required: false
        type: switch
        value: true
      credit:
        label: Credit
        options:
          allow_resize: true
          initial_height: 150
          required: false
        type: markdown
      legend:
        label: Legend
        options:
          required: false
        type: text
      mp4:
        comment: MP4 video file
        label: MP4
        options:
          accepts_mime_types:
          - video/mp4
          max_file_size: '5000000'
          required: false
        type: file
      screenshot:
        comment: Add fake browser
        label: Is screenshot?
        options:
          required: false
        type: switch
      webm:
        comment: WEBM video file
        label: WEBM
        options:
          accepts_mime_types:
          - video/webm
          max_file_size: '5000000'
          required: false
        type: file
    definitions:
      named_args:
      - editor_key: mp4
        type: string
      - editor_key: webm
        optional: true
        type: string
      - editor_key: controls
        optional: true
        type: boolean
      - editor_key: loop
        optional: true
        type: boolean
      - editor_key: legend
        optional: true
        type: string
      - editor_key: credit
        optional: true
        type: string
      - editor_key: screenshot
        optional: true
        type: boolean
      shortcode_name: video
    inline: false
    preview:
      icon: videocam
      text: Video
    template: hugo_shortcode_named_args



