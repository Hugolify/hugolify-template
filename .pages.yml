content:
  - name: home
    type: file
    path: content/_index.md
    fields:
      - name: isIndex
        type: boolean
      - name: draft
        type: boolean
      - name: title
        type: string
  - name: contact
    type: file
    path: content/contact/_index.md
  - name: legal-mentions
    type: file
    path: content/legal-mentions/_index.md
    fields:
      - name: isPage
        type: boolean
      - name: draft
        type: boolean
      - name: title
        type: string
      - name: description
        type: string
      - name: body
        type: rich-text
  - name: privacy-policy
    type: file
    path: content/privacy-policy/_index.md
    fields:
      - name: isPage
        type: boolean
      - name: draft
        type: boolean
      - name: title
        type: string
      - name: body
        type: rich-text
  - name: sitemap
    type: file
    path: content/sitemap/_index.md
    fields:
      - name: draft
        type: boolean
      - name: title
        type: string
      - name: url
        type: string
  - name: banner-data
    type: file
    path: data/banner.yml
  - name: seo-data
    type: file
    path: data/seo.yml
